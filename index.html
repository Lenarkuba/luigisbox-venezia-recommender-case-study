<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venezia.pl — Może Ci się spodobać</title>
    <style>
      :root {
        --ink: #111111;
        --muted: #6a6a6a;
        --sale: #c45c4a;
        --line: #f0f0f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3.5rem;
      }

      .section-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.55rem;
        font-weight: 400;
        margin: 0 0 1.25rem;
      }

      #lbx-recommender {
        width: 100%;
      }

      .lbx-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 1.25rem 1rem;
      }

      .lbx-card {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
      }

      .lbx-image-wrap {
        position: relative;
        aspect-ratio: 1 / 1;
        background: #fafafa;
        overflow: hidden;
      }

      .lbx-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
      }

      .lbx-labels {
        position: absolute;
        top: 0.35rem;
        right: 0.15rem;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.15rem;
      }

      .lbx-badge {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .lbx-badge-sale {
        color: var(--sale);
      }

      .lbx-details {
        padding: 0.7rem 0 0;
      }

      .lbx-title {
        font-size: 0.8rem;
        font-weight: 400;
        line-height: 1.35;
        margin: 0 0 0.35rem;
        min-height: 2.7em;
      }

      .lbx-price {
        font-size: 0.8rem;
        font-weight: 400;
        margin: 0;
      }

      @media (max-width: 960px) {
        .lbx-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .lbx-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 class="section-title">Może Ci się spodobać</h1>
      <div id="lbx-recommender"></div>
    </div>

    <script>
      var SITE_ORIGIN = "https://www.venezia.pl";
      var PLACEHOLDER_SRC =
        "data:image/svg+xml," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">' +
            '<rect width="400" height="400" fill="#f5f5f5"/>' +
            '<text x="200" y="200" text-anchor="middle" fill="#9a9a9a" font-family="Arial,sans-serif" font-size="14">Brak zdjęcia</text>' +
            "</svg>"
        );

      var LABEL_COPY = {
        is_new: "Nowość",
        is_sale: "Promocja",
      };

      // Assignment slugs are not in Magento. Map them to live PDPs so clicks
      // open a product page instead of catalog search.
      var LIVE_PATHS = {
        "/czarne-skorzane-botki-damskie-v100-11001-01":
          "/zamszowe-botki-damskie-w-kolorze-czarnym-v525-02835-02bla",
        "/bezowe-zamszowe-kozaki-damskie-v101-11002-02":
          "/bezowe-botki-zamszowe-damskie-v529-03164-02bei",
        "/brazowe-sztyblety-damskie-v102-11003-03":
          "/zamszowe-brazowe-sztyblety-damskie-v478-01931-02tdm",
        "/czarne-kozaki-za-kolano-v103-11004-04":
          "/czarne-kozaki-zamszowe-za-kolano-v449-01021-02bla",
        "/szare-zamszowe-botki-na-obcasie-v104-11005-05":
          "/szare-botki-z-zamszu-780-sue-grey",
        "/bordowe-botki-damskie-skorzane-v105-11006-06":
          "/bordowe-botki-damskie-ze-skory-naturalnej-z-wiazaniem-v407-07447-09bor",
      };

      function productHref(url) {
        if (!url) return SITE_ORIGIN;
        if (/^https?:\/\//i.test(url)) return url;
        var path = url.charAt(0) === "/" ? url : "/" + url;
        if (LIVE_PATHS[path]) path = LIVE_PATHS[path];
        return SITE_ORIGIN + path;
      }

      function formatPrice(price) {
        var match = String(price).match(/[\d]+(?:[.,]\d+)?/);
        if (!match) return price || "";
        var amount = Math.round(parseFloat(match[0].replace(",", ".")));
        if (isNaN(amount)) return price;
        return amount + " zł";
      }

      function renderLuigisBoxRecommendations(apiResponse) {
        var container = document.getElementById("lbx-recommender");
        if (!container) return;

        var hits =
          Array.isArray(apiResponse) &&
          apiResponse[0] &&
          Array.isArray(apiResponse[0].hits)
            ? apiResponse[0].hits
            : [];

        container.replaceChildren();

        if (!hits.length) {
          container.hidden = true;
          return;
        }

        container.hidden = false;

        var grid = document.createElement("div");
        grid.className = "lbx-grid";

        hits.forEach(function (hit) {
          var attrs = hit.attributes || {};
          var title = attrs.title || "Produkt";
          var labels = Array.isArray(attrs.labels) ? attrs.labels : [];
          var imageLink =
            typeof attrs.image_link === "string" ? attrs.image_link.trim() : "";

          var card = document.createElement("a");
          card.className = "lbx-card";
          card.href = productHref(hit.url);
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.setAttribute("aria-label", title);

          var imageWrap = document.createElement("div");
          imageWrap.className = "lbx-image-wrap";

          if (labels.length) {
            var labelRow = document.createElement("div");
            labelRow.className = "lbx-labels";
            labels.forEach(function (label) {
              var badge = document.createElement("span");
              badge.className = "lbx-badge";
              if (label === "is_sale") badge.classList.add("lbx-badge-sale");
              badge.textContent = LABEL_COPY[label] || label;
              labelRow.appendChild(badge);
            });
            imageWrap.appendChild(labelRow);
          }

          var img = document.createElement("img");
          img.className = "lbx-image";
          img.alt = title;
          img.loading = "lazy";
          img.decoding = "async";
          img.src = imageLink || PLACEHOLDER_SRC;
          img.addEventListener("error", function onImgError() {
            img.removeEventListener("error", onImgError);
            img.src = PLACEHOLDER_SRC;
          });
          imageWrap.appendChild(img);
          card.appendChild(imageWrap);

          var details = document.createElement("div");
          details.className = "lbx-details";

          var titleEl = document.createElement("h2");
          titleEl.className = "lbx-title";
          titleEl.textContent = title;

          var priceEl = document.createElement("p");
          priceEl.className = "lbx-price";
          priceEl.textContent = formatPrice(attrs.price);

          details.appendChild(titleEl);
          details.appendChild(priceEl);
          card.appendChild(details);
          grid.appendChild(card);
        });

        container.appendChild(grid);
      }

      var mockApiResponse = [
        {
          recommendation_type: "item_detail_alternatives",
          hits: [
            {
              url: "/czarne-skorzane-botki-damskie-v100-11001-01",
              attributes: {
                title: "Czarne skórzane botki damskie",
                price: "349.00 PLN",
                labels: ["is_new"],
                image_link:
                  "https://www.venezia.pl/media/catalog/product/cache/6e8b799aa87ce64887b6b62c29295f0b/V/5/V525_02835_02BLA__1_ec23.webp",
              },
            },
            {
              url: "/bezowe-zamszowe-kozaki-damskie-v101-11002-02",
              attributes: {
                title: "Beżowe zamszowe kozaki damskie",
                price: "459.00 PLN",
                labels: [],
              },
            },
            {
              url: "/brazowe-sztyblety-damskie-v102-11003-03",
              attributes: {
                title: "Brązowe sztyblety damskie",
                price: "399.00 PLN",
                labels: ["is_sale"],
                image_link:
                  "https://www.venezia.pl/media/catalog/product/cache/6e8b799aa87ce64887b6b62c29295f0b/V/4/V478_01931_02TDM__1_45ed.webp",
              },
            },
            {
              url: "/czarne-kozaki-za-kolano-v103-11004-04",
              attributes: {
                title: "Czarne kozaki za kolano",
                price: "529.00 PLN",
                labels: [],
                image_link:
                  "https://www.venezia.pl/media/catalog/product/cache/6e8b799aa87ce64887b6b62c29295f0b/V/4/V449_01021_02BLA__1_3798.webp",
              },
            },
            {
              url: "/szare-zamszowe-botki-na-obcasie-v104-11005-05",
              attributes: {
                title: "Szare zamszowe botki na obcasie",
                price: "379.00 PLN",
                labels: ["is_new", "is_sale"],
                image_link:
                  "https://www.venezia.pl/media/catalog/product/cache/6e8b799aa87ce64887b6b62c29295f0b/7/8/780_SUE_GREY__1_ec36.webp",
              },
            },
            {
              url: "/bordowe-botki-damskie-skorzane-v105-11006-06",
              attributes: {
                title: "Bordowe botki damskie skórzane",
                price: "319.00 PLN",
                labels: [],
                image_link:
                  "https://www.venezia.pl/media/catalog/product/cache/6e8b799aa87ce64887b6b62c29295f0b/v/4/v407_07447_09bor__1_e014.webp",
              },
            },
          ],
        },
      ];

      renderLuigisBoxRecommendations(mockApiResponse);
    </script>
  </body>
</html>
